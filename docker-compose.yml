version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: recreation-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - recreation-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recreation-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MONGODB_URI=mongodb://mongo:27017
    volumes:
      - ./backend:/app
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - recreation-network
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recreation-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - recreation-network
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - HOST=0.0.0.0
      - WATCHPACK_POLLING=true
      - DANGEROUSLY_DISABLE_HOST_CHECK=true
    stdin_open: true
    tty: true

volumes:
  mongo-data:

networks:
  recreation-network:
    driver: bridge
